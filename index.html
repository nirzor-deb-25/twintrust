<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TwinTrust — Sensor Dashboard</title>

  <script>
    // Update this address whenever you create a new Cloudflare tunnel.
    const liveDashboardURL =
      "https://groove-hung-extent-electric.trycloudflare.com/";

    window.location.replace(
      liveDashboardURL +
      window.location.search +
      window.location.hash
    );
  </script>

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1321;
      color: #eff5ff;
      font-family: Arial, sans-serif;
    }

    main {
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 42px;
    }

    .accent {
      color: #69e0d2;
    }

    p {
      color: #b2c2d8;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>TwinTrust<span class="accent">.</span></h1>
    <p>Opening the sensor dashboard…</p>

    <noscript>
      <p>
        Please enable JavaScript in your browser to open
        the dashboard automatically.
      </p>
    </noscript>
  </main>
</body>
</html>
